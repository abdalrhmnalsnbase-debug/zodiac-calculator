<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="desciption" content="موقع تفاعلي سريع ومجاني يساعدك على معرفة وكتشاف برجك الفلكي السري وحظك اليوم بناء على تاريخ ميلادك بكل سهوله.">
  <meta name="keywords" content="موقع الابراج , اكتشف الابراج ,معرفة برجي ,حاسبة الابراج,حظك اليوم">
  <title>مكتشف الأبراج الفلكية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ss.css">
</head>
<body>

  <div class="main-card">

    <!-- إعلان أعلى الصفحة -->
    <div class="top-banner-ad">
      <a href="https://auctionr.org/4/6d0fd74b8616c94d0ea4507c8256487b" target="_blank" class="smartlink-banner">
        🔥 اكتشف توافق برجك وحظك اليوم حصرياً من هنا!
      </a>
    </div>

    <!-- عنوان الصفحة -->
    <div class="header">
      <h1>مكتشف الأبراج</h1>
      <p>أدخل تاريخ ميلادك لمعرفة برجك ومميزات شخصيتك</p>
    </div>

    <!-- نموذج الإدخال -->
    <form id="zodiac-form" onsubmit="event.preventDefault(); getZodiacSign();">
      <div class="inputs-grid">
        <div class="input-group">
          <label for="day">اليوم</label>
          <input type="number" id="day" min="1" max="31" placeholder="مثال: 15" required>
        </div>

        <div class="input-group">
          <label for="month">الشهر</label>
          <select id="month" required>
            <option value="" disabled selected>اختر الشهر</option>
            <option value="1">يناير</option>
            <option value="2">فبراير</option>
            <option value="3">مارس</option>
            <option value="4">أبريل</option>
            <option value="5">مايو</option>
            <option value="6">يونيو</option>
            <option value="7">يوليو</option>
            <option value="8">أغسطس</option>
            <option value="9">سبتمبر</option>
            <option value="10">أكتوبر</option>
            <option value="11">نوفمبر</option>
            <option value="12">ديسمبر</option>
          </select>
        </div>
      </div>

      <button type="submit" class="submit-btn">إظهار اسم البرج</button>
    </form>

    <!-- مربع النتيجة ومميزات البرج وأزرار المشاركة -->
    <div id="result-box" class="result-box hidden">
      <span class="result-label">برجك الفلكي هو</span>
      <div id="zodiac-name" class="zodiac-name">--</div>
      
      <!-- مميزات البرج -->
      <p id="zodiac-traits" class="zodiac-traits"></p>

      <div class="share-container">
        <div class="share-title">مشاركة البرج مع أصدقائك:</div>
        <div class="share-buttons">
          <button type="button" onclick="shareWhatsApp()" class="share-btn whatsapp">واتساب</button>
          <button type="button" onclick="shareFacebook()" class="share-btn facebook">فيسبوك</button>
          <button type="button" onclick="copyInstagramText()" class="share-btn instagram">إنستغرام</button>
        </div>
      </div>
    </div>

  </div>

  <script src="tt.js"></script>
</body>
</html>
